<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Der letzte Bote von Königstein</title>

    <style>
        body {
            margin: 0;
            background: #080b0f;
            color: #ddd;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.7;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 35px 22px 60px;
        }

        h1 {
            text-align: center;
            color: #d6c28a;
            font-size: 2.1rem;
            margin-bottom: 5px;
        }

        h2 {
            color: #d6c28a;
            font-weight: normal;
            border-bottom: 1px solid #454545;
            padding-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-style: italic;
            margin-bottom: 40px;
        }

        .story {
            background: #10151b;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        .quote {
            border-left: 3px solid #d6c28a;
            padding-left: 18px;
            color: #cfcfcf;
            font-style: italic;
        }

        .puzzle {
            background: #111820;
            border: 1px solid #454545;
            border-radius: 10px;
            padding: 24px;
            margin-top: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 12px;
            background: #080b0f;
            color: white;
            border: 1px solid #666;
            border-radius: 6px;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #6d5b32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            cursor: pointer;
        }

        button:hover {
            background: #85703e;
        }

        .wrong {
            display: none;
            color: #d77;
            margin-top: 15px;
        }

        .success {
            display: none;
            background: #111c16;
            border: 1px solid #536b59;
            border-radius: 10px;
            padding: 24px;
            margin-top: 25px;
        }

        .light {
            text-align: center;
            font-size: 2rem;
            margin: 30px 0;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 50px;
        }

        .number {
            display: inline-block;
            width: 42px;
            height: 42px;
            line-height: 42px;
            text-align: center;
            border: 1px solid #777;
            border-radius: 50%;
            margin: 5px;
            color: #d6c28a;
            font-size: 1.2rem;
        }

        .hint {
            color: #999;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Der letzte Bote von Königstein</h1>

    <div id="subtitle" class="subtitle"></div>

    <div id="content"></div>

    <div class="footer">
        Der letzte Bote von Königstein
    </div>

</div>


<script>

const params = new URLSearchParams(window.location.search);
const station = params.get("station") || "1";

const content = document.getElementById("content");
const subtitle = document.getElementById("subtitle");


/* =========================================================
   STATION 1
   ========================================================= */

function showStation1() {

    subtitle.textContent = "Nachtcache · Station 1";

    content.innerHTML = `

        <div class="light">🌙</div>

        <div class="story">

            <h2>Der erste Funke</h2>

            <p>
                Königstein, Oktober 1813.
            </p>

            <p>
                Die Nacht liegt schwer über dem Elbtal.
                Hoch über der Stadt zeichnet sich die dunkle Silhouette
                des Königsteins gegen den Himmel ab.
            </p>

            <p>
                Ein junger Mann hastet durch die Dunkelheit.
                Sein Name ist Johann Elias Weber.
            </p>

            <p>
                In seinem Mantel trägt er einen Brief.
                Einen Brief, den niemand finden darf.
            </p>

            <p>
                Plötzlich bleibt Johann stehen.
            </p>

            <p>
                Hinter ihm erscheint ein Licht.
            </p>

            <p>
                Dann ein zweites.
            </p>

            <p class="quote">
                „Sie haben mich gefunden.“
            </p>

            <p>
                Johann greift in seine Tasche und zieht den Brief hervor.
                Doch er verbrennt ihn nicht.
            </p>

            <p>
                Stattdessen zerreißt er ihn in fünf Teile.
            </p>

            <p>
                Fünf Spuren.
                Fünf Wege.
                Fünf Lichter.
            </p>

            <p>
                Den ersten Teil versteckt er dort, wo nur jemand danach
                suchen würde, der weiß, dass er existiert.
            </p>

            <p class="quote">
                „Wenn du diese Nachricht lesen kannst,
                hast du meine erste Spur gefunden.“
            </p>

            <p>
                Dann schreibt Johann auf die Rückseite des ersten Hinweises:
            </p>

            <p class="quote">
                Nichts ist zu sehen.<br>
                Aber etwas wartet.<br>
                Chaos wird zu Ordnung.<br>
                Hat man die richtige Richtung,<br>
                Taucht der erste Weg auf.
            </p>

            <p>
                Johann wusste, dass sein Verfolger die Nachricht finden könnte.
                Deshalb versteckte er die Lösung nicht im Text selbst.
            </p>

            <p>
                <strong>
                    Suche nach dem, was am Anfang jeder Zeile steht.
                </strong>
            </p>

        </div>


        <div class="puzzle">

            <h2>Die erste Spur</h2>

            <p>
                Welches Wort ergibt sich aus den Anfangsbuchstaben
                der fünf Zeilen?
            </p>

            <input
                type="text"
                id="answer1"
                placeholder="Lösungswort eingeben"
                autocomplete="off"
            >

            <button onclick="checkStation1()">
                Spur entschlüsseln
            </button>

            <div id="wrong1" class="wrong">
                Das ist nicht die richtige Lösung.
                Johann würde sagen: „Suche genauer.“
            </div>

        </div>


        <div id="success1" class="success">

            <h2>Die Spur ist gefunden.</h2>

            <p>
                Die fünf Buchstaben ergeben:
            </p>

            <p class="quote">
                N · A · C · H · T
            </p>

            <p>
                Du hast die erste Nachricht entschlüsselt.
            </p>

            <p>
                Doch Johann hat keinen weiteren Hinweis
                hinterlassen.
            </p>

            <p>
                Stattdessen steht dort nur:
            </p>

            <p class="quote">
                „Nun wird es Zeit, die Dunkelheit zu durchsuchen.“
            </p>

            <p>
                Schalte deine Taschenlampe ein.
            </p>

            <p>
                Suche den ersten Lichtpunkt.
            </p>

            <p>
                <strong>
                    Folge der Reflektorstrecke.
                </strong>
            </p>

            <p>
                Wenn du das nächste Licht gefunden hast,
                wartet dort die zweite Spur des Nachtboten.
            </p>

        </div>
    `;
}


/* =========================================================
   STATION 2
   ========================================================= */

function showStation2() {

    subtitle.textContent = "Nachtcache · Station 2";

    content.innerHTML = `

        <div class="light">🔦</div>

        <div class="story">

            <h2>Der Blick zurück</h2>

            <p>
                Du hast die erste Spur gefunden.
            </p>

            <p>
                Johann hatte genau damit gerechnet.
            </p>

            <p>
                Nach der langen Strecke durch die Dunkelheit
                erreicht er einen Ort, an dem er stehen bleibt.
            </p>

            <p>
                Vor ihm liegen zwei Bänke.
            </p>

            <p>
                Von hier aus kann er hinunter auf Königstein blicken.
            </p>

            <p>
                Die Lichter der Stadt liegen tief unter ihm.
            </p>

            <p>
                Johann dreht sich um.
            </p>

            <p class="quote">
                „Manchmal muss man zurückblicken,
                um den richtigen Weg nach vorn zu erkennen.“
            </p>

            <p>
                Für einen Augenblick glaubt Johann,
                zwischen den dunklen Wegen ein Licht zu sehen.
            </p>

            <p>
                Dann ein zweites.
            </p>

            <p>
                Und schließlich ein drittes.
            </p>

            <p>
                Johann lächelt.
            </p>

            <p>
                Er weiß:
                Seine Verfolger sind ihm gefolgt.
            </p>

            <p>
                Doch sie kennen seinen Plan nicht.
            </p>

            <p>
                Johann nimmt den zweiten Teil seines Briefes hervor.
            </p>

            <p class="quote">
                „Drei Wege können vor dir liegen.<br>
                Zwei führen dich in die Irre.<br>
                Nur einer bringt dich weiter.“
            </p>

            <p>
                Darunter steht:
            </p>

            <p class="quote">
                „Zähle nicht die Lichter,
                die du zuerst siehst.
                Suche die Spur,
                die fünfmal antwortet.“
            </p>

        </div>


        <div class="puzzle">

            <h2>Die drei Lichter</h2>

            <p>
                Jetzt beginnt die eigentliche Suche.
            </p>

            <p>
                Schalte deine Taschenlampe ein und
                suche in der Umgebung nach den drei
                Reflektorspuren.
            </p>

            <p>
                Jede Spur besitzt eine unterschiedliche
                Anzahl von Reflektoren.
            </p>

            <div style="text-align:center; margin:20px 0;">
                <span class="number">A</span>
                <span class="number">B</span>
                <span class="number">C</span>
            </div>

            <p>
                Johann hinterließ nur einen Hinweis:
            </p>

            <p class="quote">
                „Die richtige Spur antwortet fünfmal.“
            </p>

            <p>
                <strong>
                    Finde die Reflektorspur mit fünf Lichtpunkten
                    und folge ihr.
                </strong>
            </p>

            <p class="hint">
                Die beiden anderen Spuren sind nicht gefährlich.
                Sie enden einfach – Johann wollte seine Verfolger
                in die Irre führen.
            </p>

        </div>


        <div class="story">

            <h2>Die zweite Spur</h2>

            <p>
                Du hast den zweiten Teil von Johanns Nachricht gefunden.
            </p>

            <p>
                Doch damit ist die Aufgabe noch nicht beendet.
            </p>

            <p class="quote">
                „Wenn du den richtigen Weg gefunden hast,
                folge ihm bis dorthin,
                wo der Wald den Blick freigibt.“
            </p>

            <p>
                Vor dir liegt nun die nächste Etappe.
            </p>

            <p>
                <strong>
                    Folge der richtigen Reflektorstrecke
                    in Richtung Heidepromenade.
                </strong>
            </p>

            <p>
                Dort wartet die dritte Spur des letzten Boten.
            </p>

        </div>

    `;
}
/* =========================================================
   STATION 3
   ========================================================= */

function showStation3() {

    subtitle.textContent = "Nachtcache · Station 3";

    content.innerHTML = `

        <div class="light">🌙</div>

        <div class="story">

            <h2>Der Blick des Boten</h2>

            <p>
                Johann blieb stehen.
            </p>

            <p>
                Der Weg hatte ihn aus dem Wald herausgeführt
                und plötzlich lag das Tal vor ihm.
            </p>

            <p>
                Doch bevor er weiterging, blickte er zurück.
            </p>

            <p>
                Hinter ihm lag nur Dunkelheit.
            </p>

            <p>
                Kein Licht.
            </p>

            <p>
                Kein Zeichen.
            </p>

            <p>
                Kein Verfolger.
            </p>

            <p class="quote">
                „Vielleicht habe ich sie abgeschüttelt.“
            </p>

            <p>
                Johann drehte sich wieder um.
            </p>

            <p>
                Vor ihm lag Königstein.
            </p>

            <p>
                Hoch über der Stadt zeichnete sich
                die beleuchtete Festung gegen den dunklen Himmel ab.
            </p>

            <p>
                Selbst aus dieser Entfernung war sie
                nicht zu übersehen.
            </p>

            <p>
                Johann betrachtete die Lichter eine Weile.
            </p>

            <p class="quote">
                „Sie werden glauben, dass ich dorthin zurückkehre.“
            </p>

            <p>
                Er zog den dritten Teil seines Briefes hervor.
            </p>

            <p>
                Auf dem Papier stand nur:
            </p>

            <p class="quote">
                „Schau zurück und merke dir die Dunkelheit.“
            </p>

            <p class="quote">
                „Schau nach vorn und merke dir das Licht.“
            </p>

            <p class="quote">
                „Doch folge weder dem einen noch dem anderen.“
            </p>

            <p>
                Johann faltete den Brief zusammen.
            </p>

            <p>
                Dann ging er weiter.
            </p>

        </div>


        <div class="puzzle">

            <h2>Der Weg des Boten</h2>

            <p>
                Stell dich an den Aussichtspunkt.
            </p>

            <p>
                <strong>
                    Schau zur beleuchteten Festung.
                </strong>
            </p>

            <p>
                Präge dir ihren Anblick ein.
            </p>

            <p>
                Dann blicke zurück.
            </p>

            <p>
                Was siehst du?
            </p>

            <p class="quote">
                Nur Dunkelheit.
            </p>

            <p>
                Johann sah genau dasselbe.
            </p>

            <p>
                Seine Verfolger sollten glauben,
                dass sein Weg zurück nach Königstein führte.
            </p>

            <p>
                Doch Johann kannte einen anderen Weg.
            </p>

            <p>
                <strong>
                    Nicht zur Festung.
                </strong>
            </p>

            <p>
                <strong>
                    Nicht zurück.
                </strong>
            </p>

            <p class="quote">
                „Geh dorthin, wo Johann weiterging.“
            </p>

            <p>
                Wende dich nach rechts.
            </p>

            <p>
                Suche dort nach dem ersten Lichtpunkt.
            </p>

            <p>
                Wenn du ihn gefunden hast,
                folge der Reflektorstrecke.
            </p>

        </div>


        <div class="story">

            <h2>Die dritte Spur</h2>

            <p>
                Du hast gesehen, was Johann sah.
            </p>

            <p>
                Jetzt weißt du auch,
                welchen Weg er gewählt hat.
            </p>

            <p class="quote">
                „Manchmal ist das sichtbarste Licht
                genau das, dem man nicht folgen darf.“
            </p>

            <p>
                Vor dir liegt der nächste Abschnitt.
            </p>

            <p>
                Der Weg führt weiter über den Heideberg.
            </p>

            <p>
                Dort wartet etwas,
                das Johann für seine letzte Spur ausgewählt hat.
            </p>

            <p>
                <strong>
                    Folge dem Licht.
                </strong>
            </p>

        </div>

    `;
}

/* =========================================================
   LÖSUNG STATION 1
   ========================================================= */

function checkStation1() {

    const answer = document
        .getElementById("answer1")
        .value
        .trim()
        .toUpperCase();

    if (answer === "NACHT") {

        document.getElementById("success1").style.display = "block";
        document.getElementById("wrong1").style.display = "none";

    } else {

        document.getElementById("success1").style.display = "none";
        document.getElementById("wrong1").style.display = "block";

    }
}


/* =========================================================
   STATION AUSWÄHLEN
   ========================================================= */

if (if (station === "2") {
    showStation2();
} else if (station === "3") {
    showStation3();
} else {
    showStation1();
}

</script>

</body>
</html>
